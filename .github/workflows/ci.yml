name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build .#hex --print-build-logs

      - name: Verify signature
        run: bash scripts/verify-signature.sh result/Applications/Hex.app

      - name: Run CLI
        run: ./result/bin/hex --version

      - name: Apply settings
        run: |
          HEX_APPLICATION_SUPPORT_DIR=$(mktemp -d)
          export HEX_APPLICATION_SUPPORT_DIR
          ./result/bin/hex settings apply tests/settings.json
          cat "$HEX_APPLICATION_SUPPORT_DIR/settings.json"
          ./result/bin/hex settings list | grep -E 'hotkey'
