name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build .#hex --print-build-logs

      - name: Verify signature
        run: bash scripts/verify-signature.sh result/Applications/Hex.app

      - name: Run CLI
        run: ./result/bin/hex --version
